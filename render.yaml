# Render Blueprint for Chore Quest backend
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com/blueprints → New Blueprint Instance
# 3. Connect your repo → Render reads this file → click Apply
# 4. Set the secret env vars (MONGO_URL, GOOGLE_API_KEY) when prompted
# 5. Deploy

services:
  - type: web
    name: chore-quest-api
    runtime: python
    plan: free                # change to "starter" ($7/mo) for always-on, no cold start
    region: oregon            # closest to USA West; alternatives: ohio, frankfurt, singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_NAME
        value: chore_quest
      - key: MONGO_URL
        sync: false             # paste the MongoDB Atlas connection string in the Render UI
      - key: GOOGLE_API_KEY
        sync: false             # get a free key at https://aistudio.google.com → paste in Render UI
